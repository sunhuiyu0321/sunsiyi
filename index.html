<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能云AI电商在线销售系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 导航栏 -->
  <nav class="navbar">
    <a class="brand" href="index.html">
      <span class="logo">☁️</span>
      <span>智能云AI电商</span>
    </a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <button class="cart-btn" onclick="openCart()">🛒 购物车 <span id="cart-badge" class="cart-badge" style="display:none">0</span></button>
      <span id="nav-user" style="display:none;align-items:center;gap:8px">
        👤 <span id="nav-username"></span>
        <button id="logout-btn">退出</button>
      </span>
      <a id="nav-login" href="login.html">登录 / 注册</a>
    </div>
  </nav>

  <div class="container">
    <div class="hero">
      <h1>智能云AI电商在线销售系统</h1>
      <p>汇聚 AI 硬件、云服务与智能穿戴，让科技触手可及。</p>
    </div>

    <h2 class="page-title">商品列表</h2>
    <p class="page-sub">精选热门商品，点击「加入购物车」即可选购。</p>

    <div id="product-grid" class="product-grid"><!-- JS 渲染 --></div>

    <div class="footer">© 2025 智能云AI电商在线销售系统 · 课程期中作业演示</div>
  </div>

  <!-- 购物车抽屉 -->
  <div id="cart-overlay" class="overlay"></div>
  <aside id="cart-drawer" class="drawer">
    <div class="drawer-head">
      <h3>我的购物车</h3>
      <button class="drawer-close" onclick="closeCart()">×</button>
    </div>
    <div id="cart-body" class="drawer-body"><!-- JS 渲染 --></div>
    <div class="drawer-foot">
      <div class="total-row"><span>合计</span><span id="cart-total">¥0</span></div>
      <button class="btn btn-primary btn-block" onclick="checkout()">去结算</button>
    </div>
  </aside>

  <script src="js/shop.js"></script>
</body>
</html>
